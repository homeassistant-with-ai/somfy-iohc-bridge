; Somfy io-homecontrol bridge - PlatformIO project
; Target board: Heltec WiFi LoRa32 V3 (ESP32-S3 + SX1262)

[env:heltec_wifi_lora_32_V3]
platform      = espressif32
board         = heltec_wifi_lora_32_V3
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
lib_deps      =
    jgromes/RadioLib @ ^7.1.2
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ ^4.6.1
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.1.0

; SPI/control pins for the SX1262 on this board (Heltec V3), verified against
; Velocet/LoRa32 (ARDUINO_HELTEC_WIFI_LORA_32_V3 block) and Heltec's own pin_config.h
build_flags =
    -D RADIO_CS_PIN=8
    -D RADIO_MOSI_PIN=10
    -D RADIO_MISO_PIN=11
    -D RADIO_SCK_PIN=9
    -D RADIO_RST_PIN=12
    -D RADIO_BUSY_PIN=13
    -D RADIO_DIO1_PIN=14
    -D VEXT_CTRL_PIN=36
    ; PubSubClient's default message limit (256 bytes) is too small for a
    ; Home Assistant MQTT discovery JSON payload - increase to 1024.
    -D MQTT_MAX_PACKET_SIZE=1024
